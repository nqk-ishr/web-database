server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://192.168.64.132:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri /index.html;
    }
}
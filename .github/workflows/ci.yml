name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vehicle_app
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: vehicle_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vehicle_app -d vehicle_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vehicle_app:change_me@localhost:5432/vehicle_db
      JWT_SECRET: ci-secret-key-ci-secret-key-ci-secret
      PGPASSWORD: change_me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - name: Nạp schema và dữ liệu mẫu
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U vehicle_app -d vehicle_db -f database/schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U vehicle_app -d vehicle_db -f database/seed.sql
          python backend/scripts/set_demo_passwords.py
      - name: Kiểm thử
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

# Dùng khi PHÁT TRIỂN trên một máy. Bản nộp phải chạy trên 3 VM riêng (xem deploy/).
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Bỏ chú thích khi backend/frontend đã có Dockerfile
  # backend:
  #   build: ./backend
  #   env_file: .env
  #   depends_on: [db]
  #   ports: ["8000:8000"]
  #
  # frontend:
  #   build: ./frontend
  #   ports: ["3000:80"]

volumes:
  pgdata:
